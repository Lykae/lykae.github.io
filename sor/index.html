		:root {
			--void: #120d18;
			--gold: #f0b429;
			--gold-lo: #a8741a;
			--parchment: #f4ecd8;
			--muted: #b0a48c;
			--blood: #e0524f;
			color-scheme: dark;
		}

		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
		}

		body {
			color: var(--parchment);
			font: 24px/1.25 "Monogram", "Courier New", monospace;
			-webkit-font-smoothing: none;
			font-smooth: never;
		}

		@keyframes bob { 50% { transform: translateY(-4px); } }

		#canvas {
			display: block;
			/* Swipes belong to Godot's lists/map, not browser pan or zoom. */
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			width: 100%;
			height: 100%;
			border: 0;
			outline: none;
		}

		#loading {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			padding: 16px;
			background:
				radial-gradient(ellipse at center, rgba(59, 47, 82, .55), transparent 70%),
				repeating-conic-gradient(#171020 0 25%, #1c1326 0 50%) 0 0 / 16px 16px;
			text-align: center;
			transition: opacity .3s steps(4), visibility .3s;
		}

		#loading.is-hidden { visibility: hidden; opacity: 0; pointer-events: none; }

		.loading-box { width: min(440px, 100%); }

		.loading-logo {
			width: 128px;
			height: 128px;
			image-rendering: pixelated;
			animation: bob 1s steps(2) infinite;
		}

		.loading-title {
			margin: 4px 0 0;
			color: var(--gold);
			font-size: 40px;
			letter-spacing: 3px;
			text-shadow: 3px 3px 0 #000;
		}

		.dots::after { content: ""; animation: dots 1.2s steps(1) infinite; }

		@keyframes dots {
			0% { content: ""; }
			25% { content: "."; }
			50% { content: ".."; }
			75% { content: "..."; }
		}

		#loading-message {
			min-height: 28px;
			margin: 4px 0 12px;
			color: var(--muted);
			white-space: pre-line;
		}

		.bar {
			height: 28px;
			padding: 4px;
			border: 4px solid #000;
			background: #0a0710;
			box-shadow: 0 0 0 4px var(--gold-lo);
		}

		#bar-fill {
			width: 0;
			height: 100%;
			background: repeating-linear-gradient(90deg, var(--gold) 0 12px, transparent 12px 16px);
			transition: width .15s steps(4);
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			padding: 6px 16px 8px;
			border: 4px solid #000;
			background: var(--gold);
			box-shadow: inset -4px -4px 0 var(--gold-lo), inset 4px 4px 0 #ffd873;
			color: #1a1420;
			cursor: pointer;
			font-size: 28px;
			letter-spacing: 2px;
			text-decoration: none;
			text-shadow: none;
		}

		.btn:hover { background: #ffc94a; transform: translateY(-2px); }
		.btn:active { transform: translateY(2px); box-shadow: inset 4px 4px 0 var(--gold-lo); }

		#retry { display: none; margin-top: 12px; }
		#loading.has-error #retry { display: inline-flex; }
		#loading.has-error .bar { display: none; }
		#loading.has-error .loading-title { color: var(--blood); }

		.btn:focus-visible, a:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }

		@media (max-width: 600px) {
			body { font-size: 20px; }
			.btn { font-size: 22px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation: none !important; transition: none !important; }
		}
	</style>
</head>

		}

		try {
			const syncCanvasSize = () => {
				const dpr = window.devicePixelRatio || 1;
				const rect = canvas.getBoundingClientRect();
				const width = Math.max(1, Math.round(rect.width * dpr));
				const height = Math.max(1, Math.round(rect.height * dpr));
